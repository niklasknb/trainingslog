<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trainingslog</title>
  <meta name="theme-color" content="#111214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trainingslog">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="topLeft"></div>
      <h1 id="title">Trainingslog</h1>
      <div id="topRight"></div>
    </header>
    <main id="view"><div class="loading">Lade Daten …</div></main>
    <div id="banner"></div>
    <nav id="tabs">
      <button data-act="tab" data-tab="kalender"><span class="ti">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Kalender</button>
      <button data-act="tab" data-tab="plaene"><span class="ti">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></span>Pläne</button>
      <button data-act="tab" data-tab="fortschritt"><span class="ti">
        <svg viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M5 16l5-5 4 3 6-7"/></svg></span>Fortschritt</button>
      <button data-act="tab" data-tab="uebungen"><span class="ti">
        <svg viewBox="0 0 24 24"><path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/></svg></span>Übungen</button>
      <button data-act="tab" data-tab="mehr"><span class="ti">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>Mehr</button>
    </nav>
  </div>
  <div id="sheets"></div>
  <div id="toast"></div>

  <script src="js/catalog.js"></script>
  <script src="js/db.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/app.js"></script>
  <script>
    window.addEventListener('load', () => {
      if (typeof render !== 'function') {
        document.body.innerHTML = '<div style="font:16px/1.5 -apple-system,Segoe UI,sans-serif;padding:24px;max-width:480px">' +
          '<h2>App-Dateien fehlen</h2><p>Die index.html wurde ohne die übrigen Dateien geöffnet (styles.css und den Ordner js). ' +
          'Bitte die ZIP-Datei zuerst vollständig entpacken (Rechtsklick → „Alle extrahieren“) und dann die index.html im entpackten Ordner öffnen.</p></div>';
      }
    });
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
