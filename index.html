<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trainingslog</title>
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trainingslog">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="preload" href="fonts/montserrat-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="top" class="topbar"><h1>Trainingslog</h1></header>
    <main id="view"><div class="loading">Lade Daten …</div></main>
  </div>
  <div id="bar"></div>
  <nav id="nav"></nav>
  <div id="sheets"></div>
  <div id="toast"></div>

  <script src="js/catalog.js"></script>
  <script src="js/db.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/core.js"></script>
  <script src="js/ui.js"></script>
  <script>
    window.addEventListener('load', () => {
      if (typeof render !== 'function') {
        document.body.innerHTML = '<div style="font:16px/1.5 -apple-system,Segoe UI,sans-serif;padding:24px;max-width:480px;color:#fff;background:#000">' +
          '<h2>App-Dateien fehlen</h2><p>Die index.html wurde ohne die übrigen Dateien geöffnet (styles.css und den Ordner js). ' +
          'Bitte die ZIP-Datei zuerst vollständig entpacken und dann die index.html im entpackten Ordner öffnen.</p></div>';
      }
    });
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
